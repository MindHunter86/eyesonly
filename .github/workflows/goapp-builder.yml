# Github Actions: goapp builder
name: goapp builder

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency: production

jobs:
  parse_phase:
    name: Get build tag for further artifact pushing
    runs-on: ubuntu-latest
    env:
      JOB_REF: ${{ github.ref }}
    outputs:
      BUILD_TAG: ${{ steps.tag-selector.outputs.BUILD_TAG }}
      BUILD_GOTAG: ${{ steps.gotag-selector.outputs.BUILD_GOTAG }}
      BUILD_GOTIME: ${{ steps.gotime-selector.outputs.BUILD_GOTIME }}
      BUILD_JSTAG: ${{ steps.jstag-selector.outputs.BUILD_JSTAG }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref }}
      - id: tag-selector
        run: echo "BUILD_TAG=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"
      - id: gotag-selector
        run: echo "BUILD_GOTAG=$(git describe --long | sed 's/\([^-]*-g\)/r\1/;s/-/./g')" >> "$GITHUB_OUTPUT"
      - id: gotime-selector
        run: echo "BUILD_GOTIME=$(date --rfc-3339=seconds)" >> "$GITHUB_OUTPUT"
      - id: jstag-selector
        run: echo "BUILD_JSTAG=$(git describe --long | cut -d- -f1 | tr -d 'v.')" >> "$GITHUB_OUTPUT"
      - run: |
          cat <<-EOF
            Github Actions outputs debug:
            BUILD_TAG: ${{ steps.tag-selector.outputs.BUILD_TAG }}
            BUILD_GOTAG: ${{ steps.gotag-selector.outputs.BUILD_GOTAG }}
            BUILD_GOTIME: ${{ steps.gotime-selector.outputs.BUILD_GOTIME }}
            BUILD_JSTAG: ${{ steps.jstag-selector.outputs.BUILD_JSTAG }}
          EOF

  common_static_build_phase:
    name: Static build and upload to ghr for further build steps
    runs-on: ubuntu-latest
    needs: [parse_phase]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: 1.22.12
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19
          cache: "npm"
          cache-dependency-path: internal/web/package-lock.json
      - name: Download all required imports
        run: go mod download
      - name: Generate static files
        run: go generate ./internal/web/
        env:
          APP_VERSION: ${{ needs.parse_phase.outputs.BUILD_GOTAG }}
          APP_JSVERSION: ${{ needs.parse_phase.outputs.BUILD_JSTAG }}
      - run: ls -la . && ls -la ./internal/web/dist
      - name: Upload generated static files
        uses: actions/upload-artifact@v5
        with:
          name: goapp_internal_web_dist
          path: ./internal/web/dist

  docker_build_by_depot_phase:
    name: Build standalone binary and docker image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
      id-token: write
      # Allows pushing to the GitHub Container Registry
      packages: write
    needs: [parse_phase, common_static_build_phase]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}
      - name: Download generated static files
        uses: actions/download-artifact@v6
        with:
          name: goapp_internal_web_dist
          path: ./internal/web/dist
      - run: ls -la . && ls -la ./internal/web/dist
      - uses: depot/setup-action@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # https://github.community/t/additional-function-s-lowercase-uppercase/140632
      - name: lowercase repository name
        run: |
          echo "GH_LWREPONAME=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
      - uses: depot/build-push-action@v1
        with:
          push: true
          project: ${{ secrets.DEPOT_PROJECT }}
          # platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ env.GH_LWREPONAME }}:${{ needs.parse_phase.outputs.BUILD_TAG }}
          context: .
          build-args: |
            GOAPP_MAIN_VERSION=${{ needs.parse_phase.outputs.BUILD_GOTAG }}
            GOAPP_MAIN_BUILDTIME=${{ needs.parse_phase.outputs.BUILD_GOTIME }}
      - name: Telegram notify
        run: |
          cat <<- EOF | /usr/bin/curl -s -XPOST "https://api.telegram.org/${{ secrets.TGRM_BOT_SECRET }}/sendMessage" \
            -d chat_id="${{ secrets.TGRM_CHAT_ID }}" -d text="$(cat /dev/stdin)" &>/dev/null
          OneTimeSecret Builder (Github Actions)

          Build ${{ github.run_number }} of job ${{ github.workflow }} has been completed.
          Builded commit: ${{ github.sha }}
          EOF

